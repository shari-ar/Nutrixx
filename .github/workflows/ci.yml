name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain and lockfile policy
        shell: bash
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          test -f package-lock.json
          test -z "$(find apps packages -name package-lock.json -print -quit)"

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate contract, test, and build
        run: npm run check

      - name: Store private API source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-source-maps-${{ github.sha }}
          path: apps/api/dist/**/*.map
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  containers:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose model
        run: docker compose -f infra/compose/compose.yaml -f infra/compose/compose.dev.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          load: true
          tags: nutrixx-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: web
          load: true
          tags: nutrixx-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start production-like stack
        run: docker compose -f infra/compose/compose.yaml up --detach --no-build --wait --wait-timeout 90

      - name: Probe public endpoints
        run: |
          curl --fail --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/api/v1/health
          curl --fail --show-error --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000

      - name: Print container diagnostics
        if: failure()
        run: docker compose -f infra/compose/compose.yaml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f infra/compose/compose.yaml down --volumes --remove-orphans

  persistence-contract:
    name: PostgreSQL persistence contract
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: nutrixx_contract
          POSTGRES_PASSWORD: nutrixx_contract
          POSTGRES_USER: nutrixx_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrixx_contract -d nutrixx_contract"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nutrixx_contract:nutrixx_contract@127.0.0.1:5432/nutrixx_contract
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run shared persistence contract
        run: npm run test:contract:postgres
