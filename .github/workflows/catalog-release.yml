name: Catalog release finalization

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: catalog-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    name: Publish and merge verified catalog
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'catalog-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish immutable assets and merge activation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUTRIXX_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/finalize-catalog-release.mjs
