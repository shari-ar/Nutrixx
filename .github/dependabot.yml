version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
      time: '06:00'
      timezone: Asia/Tehran
    open-pull-requests-limit: 1
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      routine-npm-updates:
        applies-to: version-updates
        patterns:
          - '*'
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
      time: '06:15'
      timezone: Asia/Tehran
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: quarterly
      time: '06:30'
      timezone: Asia/Tehran
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      docker-images:
        applies-to: version-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
