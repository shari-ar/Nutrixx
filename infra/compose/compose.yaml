name: nutrixx

x-app-build: &app-build
  context: ../..
  dockerfile: infra/docker/Dockerfile

x-app-service: &app-service
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  stop_grace_period: 10s

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s
  start_interval: 2s

services:
  api:
    <<: *app-service
    image: nutrixx-api:local
    build:
      <<: *app-build
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/v1/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))

  web:
    <<: *app-service
    image: nutrixx-web:local
    build:
      <<: *app-build
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT)
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
