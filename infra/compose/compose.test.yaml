services:
  postgres-contract:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: nutrixx_contract
      POSTGRES_PASSWORD: nutrixx_contract
      POSTGRES_USER: nutrixx_contract
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nutrixx_contract -d nutrixx_contract']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    restart: 'no'
