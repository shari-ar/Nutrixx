x-development-service: &development-service
  user: root
  working_dir: /workspace
  cap_add:
    - DAC_OVERRIDE
    - FOWNER
  restart: 'no'

x-curation-environment: &curation-environment
  NUTRIXX_CURATION_ENABLED: 'true'
  NUTRIXX_CURATION_TOKEN: ${NUTRIXX_CURATION_TOKEN:-}
  NUTRIXX_CURATION_TOKEN_FILE: /workspace/.temp/local-curation-token

x-api-workspace-volumes: &api-workspace-volumes
  - ../..:/workspace
  - api_root_node_modules:/workspace/node_modules
  - api_workspace_node_modules:/workspace/apps/api/node_modules

services:
  dev-dependencies:
    image: nutrixx-api:local
    user: root
    entrypoint:
      - /bin/sh
      - -euc
    command:
      - |
        dependency_fingerprint="$$(
          {
            sha256sum /workspace/.npmrc /workspace/package.json /workspace/package-lock.json /workspace/apps/api/package.json /workspace/apps/web/package.json /workspace/packages/canonical-schema/package.json /workspace/packages/config/package.json /workspace/packages/contracts/package.json /workspace/packages/consumption/package.json /workspace/packages/food-knowledge/package.json /workspace/packages/nutrition-engine/package.json /workspace/packages/optimizer-engine/package.json /workspace/packages/persistence/package.json /workspace/packages/persistence-indexeddb/package.json /workspace/packages/persistence-postgresql/package.json /workspace/packages/recipe-knowledge/package.json /workspace/packages/reference-quality/package.json /workspace/packages/user-context/package.json
            node --version
            npm --version
            uname -sm
          } | sha256sum | awk '{print $$1}'
        )"

        sync_dependencies() {
          source_dir="$$1"
          destination="$$2"
          marker="$$destination/.nutrixx-dependencies.sha256"

          case "$$destination" in
            /volumes/api-root|/volumes/api-workspace|/volumes/web-root|/volumes/web-workspace) ;;
            *) echo "Refusing unsafe dependency destination: $$destination" >&2; exit 70 ;;
          esac

          test -d "$$source_dir"
          mkdir -p "$$destination"

          if [ "$$(cat "$$marker" 2>/dev/null || true)" = "$$dependency_fingerprint" ]; then
            echo "Dependencies are current: $$destination"
            return
          fi

          echo "Synchronizing dependencies: $$destination"
          find "$$destination" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "$$source_dir"/. "$$destination"/
          printf '%s\n' "$$dependency_fingerprint" > "$$marker"
          chown -R root:root "$$destination"
        }

        sync_dependencies /workspace/node_modules /volumes/api-root
        sync_dependencies /workspace/apps/api/node_modules /volumes/api-workspace
        sync_dependencies /workspace/node_modules /volumes/web-root
        sync_dependencies /workspace/apps/web/node_modules /volumes/web-workspace
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - api_root_node_modules:/volumes/api-root
      - api_workspace_node_modules:/volumes/api-workspace
      - web_root_node_modules:/volumes/web-root
      - web_workspace_node_modules:/volumes/web-workspace
    restart: 'no'

  dev-workspace:
    <<: *development-service
    image: nutrixx-api:local
    command: npm run build:packages
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes: *api-workspace-volumes
    depends_on:
      dev-dependencies:
        condition: service_completed_successfully

  api:
    <<: *development-service
    build:
      target: development
    command: npm run start:dev --workspace=@nutrixx/api
    environment:
      <<: *curation-environment
      NODE_ENV: development
      NUTRIXX_PROJECT_ROOT: /workspace
    volumes: *api-workspace-volumes
    depends_on:
      dev-workspace:
        condition: service_completed_successfully

  web:
    <<: *development-service
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --workspace=@nutrixx/web
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - ${WEB_PORT:-3000}
    environment:
      NODE_ENV: development
    volumes:
      - ../..:/workspace
      - web_root_node_modules:/workspace/node_modules
      - web_workspace_node_modules:/workspace/apps/web/node_modules
    depends_on:
      dev-workspace:
        condition: service_completed_successfully

  radar:
    <<: *development-service
    image: nutrixx-api:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: development
    command: node .devcontainer/start-data-quality-radar.mjs --foreground
    environment:
      <<: *curation-environment
      NODE_ENV: development
      NUTRIXX_CURATION_API_URL: http://api:3001/api/v1
      NUTRIXX_GITHUB_TOKEN: ${NUTRIXX_GITHUB_TOKEN:-}
      NUTRIXX_GITHUB_TOKEN_FILE: /workspace/.temp/local-github-token
      NUTRIXX_GITHUB_REPOSITORY: ${NUTRIXX_GITHUB_REPOSITORY:-shari-ar/Nutrixx}
    ports:
      - '127.0.0.1:3002:3002'
    volumes: *api-workspace-volumes
    depends_on:
      dev-workspace:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  api_root_node_modules:
  api_workspace_node_modules:
  web_root_node_modules:
  web_workspace_node_modules:
